<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nppm — Node Project Package Manager</title>
  <link rel="icon" type="image/svg+xml" href="/Frontend/logo.svg" />
  <script type="module" src="/main.ts"></script>
</head>
<body>
  <div class="topbar">
    <img class="topbar-logo" src="/Frontend/logo.svg" alt="nppm" />
    <span class="topbar-header" id="topbarheader">nppm</span>
    <div class="topbar-spacer"></div>
    <button id="global-scan-btn" class="topbar-btn">Scan all</button>
    <div id="global-scan-progress" class="topbar-progress" style="display:none">
      <div id="global-scan-progress-fill" class="topbar-progress-fill"></div>
      <div id="global-scan-progress-text" class="topbar-progress-text"></div>
    </div>
    <div class="topbar-lang" id="topbar-lang"></div>
    <div id="resizer-topbar" class="resizer"></div>
  </div>
  <div id="main">
    <div id="controls">
      <div class="treeview" id="treeview"></div>
    </div>
    <div id="resizer" class="resizer"></div>
    <div id="list"></div>
  </div>
</body>
</html>
