name: nppm supply-chain scan

# nppm dogfoods its own action — every push and PR runs the full
# scanner family against this repo's dependencies. Findings show up
# under Security → Code scanning alerts; PRs get a sticky comment
# with the CVE delta.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write
  pull-requests: write

# Opt the third-party JS actions into the Node 24 runtime now.
# Node 20 inside JS actions is deprecated starting 2026-06-16 and
# removed 2026-09-16; the env var is GitHub's official opt-in to
# the new runtime while we wait for actions/{checkout,cache,setup-
# node}@v5 to ship.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  nppm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # 22 is the current Node LTS as of mid-2026; Node 20 LTS
          # ended 2026-04-30. Stays under the package.json `engines`
          # range (`>=20`).
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .nppm-cache
          key: nppm-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nppm-cache-${{ runner.os }}-
      - id: nppm
        uses: ./.github/actions/scan
        with:
          # Real users keep their nppm.json gitignored. The dogfood
          # workflow ships a minimal CI-only config that scans
          # nppm's own dep tree.
          config-path: .github/nppm.ci.json
          fail-on: warn
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.nppm.outputs.sarif-path != ''
        with:
          sarif_file: ${{ steps.nppm.outputs.sarif-path }}